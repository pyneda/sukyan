  /api/v1/auth/token/renew:
    post:
      consumes:
      - application/json
      description: |-
        Renew access and refresh tokens. The refresh token is read from the
        HttpOnly cookie set at sign-in, falling back to the request body for
        non-browser clients. No access token is required, so a session resumes
        even after the access token has expired.
      parameters:
      - description: Refresh token, when not supplied as a cookie
        in: body
        name: refresh_token
        schema:
          $ref: '#/definitions/api.Renew'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RenewTokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: renew access and refresh tokens
      tags:
      - Auth
  /api/v1/auth/user/sign/in:
    post:
      consumes:
      - application/json
      description: |-
        Auth user and return access and refresh token. The refresh token
        is also set as an HttpOnly cookie scoped to /api/v1/auth; browser
        clients should rely on that cookie rather than storing the token.
      parameters:
      - description: SignIn payload
        in: body
        name: signIn
        required: true
        schema:
          $ref: '#/definitions/api.SignIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SignInResponse'
      summary: auth user and return access and refresh token
      tags:
      - Auth
  /api/v1/auth/user/sign/out:
    post:
      consumes:
      - application/json
      description: |-
        Clears the refresh token cookie, ending the session. Deliberately
        unauthenticated: clearing a cookie needs no identity, and requiring
        a live access token would leave an expired session unable to sign out.
      produces:
      - application/json
      responses:
        "204":
          description: ok
          schema:
            type: string
      summary: de-authorize user and clear the refresh token
      tags:
      - Auth
