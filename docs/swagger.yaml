    properties:
      headers:
        additionalProperties:
          type: string
        type: object
      include_optional:
        description: |-
          IncludeOptional is a pointer so an omitted field keeps optional
          parameters, which is what a caller exploring an unknown service wants.
        type: boolean
      prefer_soap_12:
