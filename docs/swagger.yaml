  /api/v1/playground/ws/sessions/{id}/stream:
    get:
      description: |-
        Upgrades the connection to a WebSocket that streams interactive state changes,
        frame events and run progress for the given playground session. Authenticates via
        a `?token=<jwt>` query param because browsers cannot set Authorization headers on
        WebSocket handshakes. Optional `?since=<seq>` replays events with seq > since.
      parameters:
      - description: Playground Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: JWT auth token
        in: query
        name: token
        required: true
        type: string
      - description: Replay events with seq greater than this value
        in: query
        name: since
        type: integer
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "426":
          description: Upgrade Required
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream control events for a playground WebSocket session
      tags:
      - Playground
  /api/v1/playground/ws/sessions/import-connection:
    post:
      consumes:
      - application/json
      description: |-
        Derive a scripted WS replay session from a captured WebSocket connection. Each
        sent text frame becomes a step; received frames between two sent frames attach a
        wait_for(any) hint to the preceding step. Binary frames are skipped. Long
        histories are capped at importMessageCap messages.
      parameters:
      - description: Import Connection Input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.ImportConnectionInput'
      produces:
      - application/json
      responses:
