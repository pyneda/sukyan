info:
  contact: {}
  description: The Sukyan API documentation.
  title: Sukyan API
  version: "0.1"
paths:
  /api/v1/api-auth-configs:
    get:
      consumes:
      - application/json
      description: Returns a list of API authentication configurations
      parameters:
      - description: Workspace ID
        in: query
        name: workspace_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.APIAuthConfigListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List API auth configurations
      tags:
      - api-auth
    post:
      consumes:
      - application/json
      description: Creates a new API authentication configuration
      parameters:
      - description: Auth config input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.CreateAPIAuthConfigInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.APIAuthConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create API auth configuration
      tags:
      - api-auth
  /api/v1/api-auth-configs/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an API authentication configuration
      parameters:
      - description: Auth Config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete API auth configuration
      tags:
      - api-auth
    get:
      consumes:
      - application/json
      description: Returns a single API authentication configuration
      parameters:
      - description: Auth Config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.APIAuthConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get API auth configuration by ID
      tags:
      - api-auth
    patch:
      consumes:
      - application/json
      description: Updates an existing API authentication configuration
      parameters:
      - description: Auth Config ID
        in: path
        name: id
        required: true
        type: string
      - description: Update input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.UpdateAPIAuthConfigInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.APIAuthConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update API auth configuration
      tags:
      - api-auth
  /api/v1/api-auth-configs/{id}/test-refresh:
    post:
      consumes:
      - application/json
      description: Executes a token refresh request and returns the result
