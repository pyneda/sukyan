definitions:
  actions.Action:
    properties:
      condition:
        allOf:
        - $ref: '#/definitions/actions.AssertCondition'
        enum:
        - contains
        - equals
        - visible
        - hidden
      duration:
        type: integer
      expression:
        type: string
      file:
        type: string
      for:
        allOf:
        - $ref: '#/definitions/actions.WaitCondition'
        enum:
        - visible
        - hidden
        - enabled
        - load
      position:
        allOf:
        - $ref: '#/definitions/actions.ScrollPosition'
        enum:
        - top
        - bottom
      selector:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/actions.ActionType'
        enum:
        - navigate
        - click
        - fill
        - wait
        - assert
        - scroll
        - screenshot
        - sleep
        - evaluate
      url:
        type: string
      value:
        type: string
    required:
    - type
    type: object
  actions.ActionFailure:
    properties:
      message:
        type: string
      step_index:
        type: integer
      type:
        type: string
    type: object
  actions.ActionStepResult:
    properties:
      assertion:
        $ref: '#/definitions/actions.AssertionResult'
      duration_ms:
        type: integer
      error:
        type: string
      evaluation:
        $ref: '#/definitions/actions.EvaluationResult'
      index:
        type: integer
      screenshot:
        $ref: '#/definitions/actions.ScreenshotResult'
      status:
        type: string
      target:
        type: string
      type:
        type: string
    type: object
  actions.ActionType:
    enum:
    - navigate
    - click
    - fill
    - wait
    - assert
    - scroll
    - screenshot
    - sleep
    - evaluate
    type: string
    x-enum-varnames:
    - ActionNavigate
    - ActionClick
    - ActionFill
    - ActionWait
    - ActionAssert
    - ActionScroll
    - ActionScreenshot
    - ActionSleep
    - ActionEvaluate
  actions.ActionsExecutionResults:
    properties:
      duration_ms:
        type: integer
      failure:
        $ref: '#/definitions/actions.ActionFailure'
      logs:
        items:
          $ref: '#/definitions/lib.LogEntry'
        type: array
      steps:
        items:
          $ref: '#/definitions/actions.ActionStepResult'
        type: array
      succeeded:
        type: boolean
    type: object
  actions.AssertCondition:
    enum:
    - contains
    - equals
    - visible
    - hidden
    type: string
    x-enum-varnames:
    - AssertContains
    - AssertEquals
    - AssertVisible
    - AssertHidden
  actions.AssertionResult:
    properties:
      actual:
        type: string
      condition:
        type: string
      expected:
        type: string
      passed:
        type: boolean
      selector:
        type: string
    type: object
  actions.EvaluationResult:
    properties:
      expression:
        type: string
      type:
        type: string
      value:
        items:
          type: integer
        type: array
    type: object
  actions.ScreenshotResult:
    properties:
      data:
        type: string
      output_file:
        type: string
      selector:
        type: string
    type: object
  actions.ScrollPosition:
    enum:
    - top
    - bottom
    type: string
    x-enum-varnames:
    - ScrollTop
    - ScrollBottom
  actions.WaitCondition:
    enum:
    - visible
    - hidden
    - enabled
    - load
    type: string
    x-enum-varnames:
    - WaitVisible
    - WaitHidden
    - WaitEnabled
    - WaitLoad
  api.APIAuthConfigListResponse:
