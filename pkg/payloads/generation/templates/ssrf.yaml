id: "ssrf"
issue_code: "ssrf"
detection_condition: "or"
detection_methods:
  - oob_interaction:
      oob_address: "{{.oob_address}}"
      confidence: 100
vars:
  - name: oob_address
    value: "{{interactionAddress}}"
templates:
  - "http://{{.oob_address}}"
  - "https://{{.oob_address}}"
  # Bare authority: reaches sinks that take a host rather than a URL (port
  # probes, connectivity checks) and still yields a DNS interaction.
  - "{{.oob_address}}"
categories:
  - ssrf
